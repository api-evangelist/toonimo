name: Toonimo
description: >-
  Toonimo is a digital adoption platform (DAP) that overlays personalized,
  interactive on-screen guidance onto enterprise software and websites. Using
  patented voice, text-bubble, and visual-cue walkthroughs, Toonimo guides end
  users and employees through onboarding, self-service, and complex workflows to
  increase conversions, accelerate software adoption, and reduce support costs.
  It layers on top of platforms such as Salesforce, SAP SuccessFactors, Workday,
  ServiceNow, Oracle Cloud, Microsoft Dynamics, Coupa, and SharePoint, and
  enables subject-matter experts (not just developers) to build and maintain
  adoption content. Toonimo is a marketing/product company backed by Lightspeed
  Venture Partners; it does not currently publish a public developer API.
